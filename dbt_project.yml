name: divvy_demand_forecast
version: "1.0.0"
config-version: 2

profile: divvy_demand_forecast

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Trailing window the seasonal baseline averages over. 8 weeks trades
  # "enough observations per cell" against "recent enough that a service
  # change doesn't bias the mean".
  lookback_weeks: 8
  # Forecast horizon in days.
  horizon_days: 7

models:
  divvy_demand_forecast:
    staging:
      +materialized: view
    marts:
      +materialized: table
